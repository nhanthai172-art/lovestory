<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kỷ Niệm Tình Yêu 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            overflow-x: hidden;
            position: relative;
            user-select: none;
        }

        /* --- Header & Khung Avatar --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
            width: 100%;
            max-width: 500px;
        }

        .couple-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .avatar-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .avatar-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #ff4b72, #ff85a2);
            box-shadow: 0 6px 15px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s ease;
        }

        .avatar-wrapper:active {
            transform: scale(0.95);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid white;
            background-color: #fff;
        }

        .edit-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #d81b60;
            color: white;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 10px;
            border: 1px solid white;
            font-weight: bold;
        }

        .person-name {
            margin-top: 6px;
            color: #d81b60;
            font-size: 1.05rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .heart-icon {
            color: #e91e63;
            font-size: 1.8rem;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        header p {
            color: #555;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* --- Thanh Nút Bấm --- */
        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }

        .btn-custom {
            flex: 1;
            background: #d81b60;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn-custom:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #ffffff;
            color: #d81b60;
            border: 1.5px solid #d81b60;
        }

        /* --- Album Gallery (Tối ưu Mobile Grid) --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 800px;
            z-index: 2;
            margin-bottom: 30px;
        }

        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
            }
            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }
        }

        .photo-card {
            background: white;
            padding: 8px 8px 12px 8px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            text-align: center;
        }

        .photo-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        @media (min-width: 600px) {
            .photo-card img {
                height: 200px;
            }
        }

        .caption {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Modal Phóng To & Tương Tác Cảm Ứng --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            touch-action: none;
        }

        .modal-body {
            position: relative;
            width: 100vw;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #modalImg {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            transition: transform 0.05s ease-out;
            transform-origin: center center;
            will-change: transform;
        }

        .modal-caption {
            color: white;
            margin-top: 10px;
            font-size: 0.95rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            max-width: 85%;
            z-index: 102;
        }

        .zoom-controls {
            position: absolute;
            bottom: 65px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 102;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            font-size: 30px;
            z-index: 103;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 24px;
            z-index: 102;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* --- Hiệu ứng trái tim bay --- */
        .heart {
            position: fixed;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            animation: flyHeart 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes flyHeart {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header Chứa 2 Avatar & Tên Hai Bạn -->
    <header>
        <div class="couple-container">
            <!-- Avatar 1 -->
            <div class="avatar-box" onclick="triggerAvatarUpload(1)" title="Bấm để đổi ảnh">
                <div class="avatar-wrapper">
                    <img id="avatarImg1" class="avatar-img" src="assets/avatar_1.jpg" alt="Avatar 1">
                    <span class="edit-badge">Đổi</span>
                </div>
                <span id="person1" class="person-name">Danh Nhân</span>
            </div>

            <div class="heart-icon">💖</div>

            <!-- Avatar 2 -->
            <div class="avatar-box" onclick="triggerAvatarUpload(2)" title="Bấm để đổi ảnh">
                <div class="avatar-wrapper">
                    <img id="avatarImg2" class="avatar-img" src="assets/avatar_2.jpg" alt="Avatar 2">
                    <span class="edit-badge">Đổi</span>
                </div>
                <span id="person2" class="person-name">Thanh Thảo</span>
            </div>
        </div>
       
    </header>

    <!-- Thanh Nút Điều Khiển -->
    <div class="controls-bar">
        
        <button class="btn-custom" onclick="document.getElementById('fileInput').click()">+ Thêm Ảnh</button>
    </div>

    <!-- Inputs Ẩn Tải File -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="addNewPhoto(event)">
    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="changeAvatar(event)">

    <!-- Gallery Danh Sách Ảnh Kỷ Niệm -->
    <div class="gallery" id="gallery"></div>

    <!-- Modal Phóng To Ảnh Tương Tác Điện Thoại -->
    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</div>
        <div class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</div>

        <div class="modal-body" id="modalBody">
            <img id="modalImg" alt="Kỷ niệm">
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomImage(0.3)">+</button>
            <button class="zoom-btn" onclick="zoomImage(-0.3)">-</button>
            <button class="zoom-btn" onclick="resetZoom()">100%</button>
            <button class="zoom-btn" onclick="rotateImage()">↻</button>
        </div>

        <div id="modalText" class="modal-caption"></div>
    </div>

   <script>
    let photos = [
        { src: "assets/anh_1.jpg", caption: 'Lần đầu đi chơi xa cùng nhau ✨' },
        { src: 'assets/anh_2.jpg', caption: 'Nụ cười rạng rỡ của em 🌸' },
        { src: 'assets/anh_3.jpg', caption: 'Chiều hoàng hôn bình yên 🌅' },
        { src: 'assets/anh_4.jpg', caption: 'Bên nhau qua ngày mưa 🌧️' },
        { src: 'assets/anh_5.jpg', caption: 'Bên nhau qua ngày mưa 🌧️' },
        { src: 'assets/anh_6.jpg', caption: 'Bên nhau qua ngày mưa 🌧️' },
        { src: 'assets/anh_7.jpg', caption: 'Bên nhau qua ngày mưa 🌧️' },
        { src: 'assets/anh_8.mp4', type: 'video', caption: 'Bên nhau qua ngày mưa 🌧️' }
    ];

    let currentIndex = 0;
    let activeAvatarTarget = 1;
    let scale = 1, translateX = 0, translateY = 0, rotation = 0;
    let isDragging = false, startX = 0, startY = 0;
    let initialPinchDistance = null;

    // 1. Quản lý Avatar & Tên
    function triggerAvatarUpload(target) {
        activeAvatarTarget = target;
        document.getElementById('avatarInput').click();
    }

    function changeAvatar(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(`avatarImg${activeAvatarTarget}`).src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function editCoupleNames() {
        const name1 = prompt("Tên người thứ 1:", document.getElementById("person1").innerText);
        if (name1 && name1.trim()) document.getElementById("person1").innerText = name1.trim();

        const name2 = prompt("Tên người thứ 2:", document.getElementById("person2").innerText);
        if (name2 && name2.trim()) document.getElementById("person2").innerText = name2.trim();
    }

    // 2. Render Album (Đã cập nhật phân biệt Ảnh và Video)
    function renderGallery() {
        const galleryEl = document.getElementById('gallery');
        galleryEl.innerHTML = '';
        photos.forEach((photo, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.onclick = () => openModal(index);

            const isVideo = photo.type === 'video' || photo.src.endsWith('.mp4');
            const mediaHtml = isVideo
                ? `<video src="${photo.src}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`
                : `<img src="${photo.src}" alt="Ảnh ${index + 1}">`;

            card.innerHTML = `
                ${mediaHtml}
                <div class="caption">${photo.caption}</div>
            `;
            galleryEl.appendChild(card);
        });
    }

    // 3. Modal Phóng To & Thao Tác Cảm Ứng (Đã sửa để phóng to được cả Video)
    function openModal(index) {
        currentIndex = index;
        document.getElementById("imageModal").style.display = "flex";
        updateModalContent();
    }

    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
        resetZoom();
    }

    function updateModalContent() {
        resetZoom();
        const photo = photos[currentIndex];
        const isVideo = photo.type === 'video' || photo.src.endsWith('.mp4');
        const oldMedia = document.getElementById("modalImg");

        // Tạo thẻ video hoặc img tương ứng cho Modal
        const newMedia = document.createElement(isVideo ? 'video' : 'img');
        newMedia.id = "modalImg";
        newMedia.src = photo.src;

        if (isVideo) {
            newMedia.autoplay = true;
            newMedia.loop = true;
            newMedia.controls = true; // Hiện thanh điều khiển phát/dừng/bật tiếng khi phóng to
            newMedia.playsInline = true;
        }

        if (oldMedia && oldMedia.parentNode) {
            oldMedia.parentNode.replaceChild(newMedia, oldMedia);
        }

        document.getElementById("modalText").innerText = photo.caption;
    }

    function changeImage(dir) {
        currentIndex = (currentIndex + dir + photos.length) % photos.length;
        updateModalContent();
    }

    function applyTransform() {
        const modalImg = document.getElementById("modalImg");
        if (modalImg) {
            modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotation}deg)`;
        }
    }

    function zoomImage(amount) {
        scale = Math.min(Math.max(0.8, scale + amount), 4);
        if (scale === 1) { translateX = 0; translateY = 0; }
        applyTransform();
    }

    function resetZoom() {
        scale = 1; translateX = 0; translateY = 0; rotation = 0;
        applyTransform();
    }

    function rotateImage() {
        rotation = (rotation + 90) % 360;
        applyTransform();
    }

    // Tương tác chạm điện thoại (Touch Events)
    const modalBody = document.getElementById("modalBody");

    modalBody.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        } else if (e.touches.length === 2) {
            initialPinchDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    });

    modalBody.addEventListener("touchmove", (e) => {
        if (e.touches.length === 1 && isDragging && scale > 1) {
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            applyTransform();
        } else if (e.touches.length === 2 && initialPinchDistance) {
            const newDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const diff = (newDist - initialPinchDistance) / 200;
            zoomImage(diff);
            initialPinchDistance = newDist;
        }
    });

    modalBody.addEventListener("touchend", () => {
        isDragging = false;
        initialPinchDistance = null;
    });

    // 4. Thêm File Mới (Tự động nhận biết nếu tệp tải lên là Video)
    function addNewPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = function(e) {
                const caption = prompt("Lời nhắn cho tệp này:", "Khoảnh khắc đáng nhớ ✨");
                photos.unshift({ 
                    src: e.target.result, 
                    type: isVideo ? 'video' : 'image',
                    caption: caption || 'Kỷ niệm đẹp ❤️' 
                });
                renderGallery();
            };
            reader.readAsDataURL(file);
        }
    }

    // 5. Hiệu ứng trái tim bay
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 16 + 10) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 6000);
    }

    renderGallery();
    setInterval(createHeart, 500);
</script>
</body>
</html>
